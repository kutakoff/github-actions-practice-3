services:
  db:
    image: postgres:16
    container_name: practical3-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: practical3-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: ./app
    container_name: practical3-app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: 5000
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
